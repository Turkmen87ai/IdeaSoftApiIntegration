[project]
name = "ideasoftapi-mcp"
version = "1.0.0"
description = "IdeaSoft Admin API, Store API and webhook MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",
]

[project.scripts]
ideasoftapi-mcp = "ideasoftapi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideasoftapi_mcp"]
