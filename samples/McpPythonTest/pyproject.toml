[project]
name = "ideasoftapi-mcp-python-test"
version = "1.0.0"
description = "IdeaSoftApi .NET and Python MCP servers için çevrimdışı örnek istemci"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",
]

[project.scripts]
ideasoftapi-mcp-python-test = "mcp_python_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_python_test"]
